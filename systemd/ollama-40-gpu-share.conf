# Installed by gpu-share (scripts/frontdoor.sh on). Moves ollama behind the
# gpu-share broker: the broker owns :11434 on all interfaces and forwards here.
# Remove this file (frontdoor.sh off) to put ollama back on :11434.
# Sorts after 20-listen-beyond-loopback.conf, so this OLLAMA_HOST wins.
[Service]
Environment="OLLAMA_HOST=127.0.0.1:11435"
